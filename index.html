<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Đảo Bit Ngẫu Nhiên</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s infinite',
                        'flip': 'flip 0.6s cubic-bezier(0.4, 0, 0.2, 1)',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(6, 182, 212, 0.4)' },
                            '50%': { boxShadow: '0 0 25px rgba(6, 182, 212, 0.8)' },
                        },
                        flip: {
                            '0%': { transform: 'rotateY(0deg) scale(1)' },
                            '50%': { transform: 'rotateY(180deg) scale(1.15)' },
                            '100%': { transform: 'rotateY(360deg) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Inter & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header / Theme Switcher -->
    <header class="w-full max-w-2xl mx-auto p-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-cyan-500 flex items-center justify-center text-slate-900 font-bold text-lg shadow-lg shadow-cyan-500/30">
                01
            </div>
            <span class="font-bold text-xl tracking-wide bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">BitFlipper</span>
        </div>
        <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition-all border border-slate-700/60 flex items-center justify-center w-10 h-10">
            <i class="fa-solid fa-sun text-amber-400 hidden dark:block"></i>
            <i class="fa-solid fa-moon text-slate-700 block dark:hidden"></i>
        </button>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex items-center justify-center p-4 w-full max-w-2xl mx-auto">
        <div class="w-full bg-slate-800/80 dark:bg-slate-800/80 backdrop-blur-xl border border-slate-700/70 rounded-3xl p-5 sm:p-8 shadow-2xl transition-all relative overflow-hidden">
            
            <!-- Tiêu đề & Hướng dẫn -->
            <div class="text-center mb-6">
                <h1 class="text-2xl sm:text-3xl font-extrabold mb-2 text-white">Nhập Mã Bit Ngẫu Nhiên</h1>
                <p class="text-sm text-slate-400">Chọn độ dài chuỗi (4 - 10). Nhập <span class="text-cyan-400 font-bold">0</span> hoặc <span class="text-cyan-400 font-bold">1</span>, hệ thống sẽ tự động đảo ngẫu nhiên <span class="text-amber-400 font-bold">2 vị trí</span>.</p>
            </div>

            <!-- Bộ chọn số lượng ô (Pills) -->
            <div class="mb-6">
                <label class="block text-xs uppercase tracking-wider font-semibold text-slate-400 text-center mb-2">Chọn số lượng ô nhập</label>
                <div class="flex justify-center items-center gap-1.5 sm:gap-2 flex-wrap" id="lengthSelector">
                    <!-- Dynamic Pill Buttons 4..10 -->
                </div>
            </div>

            <!-- Khung nhập liệu (Tự động render theo length) -->
            <div class="flex justify-center items-center gap-1.5 sm:gap-2.5 mb-6 overflow-x-auto py-2 px-1" id="otpContainer">
                <!-- Input elements generated via JavaScript -->
            </div>

            <!-- Khu vực hiển thị thông báo / trạng thái -->
            <div id="statusMessage" class="text-center min-h-[24px] mb-6 text-sm font-medium text-slate-400">
                Hãy nhập chữ số đầu tiên...
            </div>

            <!-- Khung Kết Quả (Ban đầu ẩn) -->
            <div id="resultBox" class="hidden opacity-0 transform translate-y-4 transition-all duration-500 bg-slate-900/60 rounded-2xl p-4 sm:p-5 border border-slate-700/80 mb-6">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-2 mb-3">
                    <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">Kết quả sau khi đảo 2 bit</span>
                    <span id="flippedIndicesBadge" class="text-xs px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 font-semibold border border-amber-500/30">
                        Đã đảo vị trí: -
                    </span>
                </div>

                <!-- Hiển thị các thẻ kết quả -->
                <div class="flex justify-center items-center gap-1.5 sm:gap-2.5 my-4 perspective-1000 overflow-x-auto py-2" id="resultCardsContainer">
                    <!-- Result cards generated via JavaScript -->
                </div>

                <!-- So sánh trước / sau -->
                <div class="mt-4 pt-3 border-t border-slate-800 flex justify-around text-xs sm:text-sm text-slate-400">
                    <div>Mã gốc: <span id="originalCode" class="font-mono text-cyan-400 font-bold tracking-wider">-----</span></div>
                    <div>Mã mới: <span id="newCode" class="font-mono text-emerald-400 font-bold tracking-wider">-----</span></div>
                </div>
            </div>

            <!-- Nút Hành Động -->
            <div class="flex gap-3">
                <button id="resetBtn" onclick="resetApp()" 
                        class="w-full py-3.5 px-4 rounded-xl bg-slate-700 hover:bg-slate-600 active:scale-[0.98] text-white font-semibold transition-all duration-200 flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Nhập lại</span>
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-2xl mx-auto p-4 text-center text-xs text-slate-500">
        Ứng dụng mô phỏng xử lý Bit OTP - Trải nghiệm tương tác trực quan
    </footer>

    <!-- Logic JavaScript -->
    <script>
        // App State
        let currentLength = 5; // Mặc định 5 ô

        // DOM Elements
        const lengthSelector = document.getElementById('lengthSelector');
        const otpContainer = document.getElementById('otpContainer');
        const statusMessage = document.getElementById('statusMessage');
        const resultBox = document.getElementById('resultBox');
        const resultCardsContainer = document.getElementById('resultCardsContainer');
        const flippedIndicesBadge = document.getElementById('flippedIndicesBadge');
        const originalCodeSpan = document.getElementById('originalCode');
        const newCodeSpan = document.getElementById('newCode');

        // Khởi tạo ứng dụng
        window.addEventListener('DOMContentLoaded', () => {
            renderLengthSelector();
            initInputs(currentLength);
        });

        // Tạo danh sách nút chọn độ dài 4..10
        function renderLengthSelector() {
            lengthSelector.innerHTML = '';
            for (let l = 4; l <= 10; l++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = `${l} ô`;
                btn.className = getSelectorBtnClass(l === currentLength);
                btn.onclick = () => changeLength(l);
                lengthSelector.appendChild(btn);
            }
        }

        function getSelectorBtnClass(isSelected) {
            if (isSelected) {
                return 'px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/30 transition-all';
            }
            return 'px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium bg-slate-700/60 text-slate-300 hover:bg-slate-700 hover:text-white transition-all';
        }

        // Thay đổi độ dài ô nhập
        function changeLength(newLen) {
            if (newLen === currentLength) return;
            currentLength = newLen;
            renderLengthSelector();
            initInputs(currentLength);
            hideResult();
        }

        // Render các ô Input dựa vào số lượng length được chọn
        function initInputs(length) {
            otpContainer.innerHTML = '';
            
            // Tính toán kích thước ô dựa vào số lượng để không bị vỡ giao diện trên điện thoại
            let sizeClass = 'w-10 h-12 sm:w-12 sm:h-14 text-xl sm:text-2xl';
            if (length <= 5) {
                sizeClass = 'w-12 h-14 sm:w-14 sm:h-16 text-2xl sm:text-3xl';
            } else if (length >= 8) {
                sizeClass = 'w-8 h-11 sm:w-11 sm:h-13 text-lg sm:text-xl';
            }

            for (let i = 0; i < length; i++) {
                const input = document.createElement('input');
                input.type = 'tel';
                input.inputMode = 'numeric';
                input.pattern = '[0-1]*';
                input.maxLength = 1;
                input.dataset.index = i;
                input.autocomplete = 'off';
                input.className = `otp-input ${sizeClass} text-center font-bold rounded-xl sm:rounded-2xl bg-slate-900/90 border-2 border-slate-700 text-cyan-400 focus:border-cyan-400 focus:ring-4 focus:ring-cyan-500/20 focus:outline-none transition-all duration-200 select-none shadow-inner flex-shrink-0`;

                // Sự kiện nhập liệu
                input.addEventListener('input', (e) => handleInput(e, i));
                // Sự kiện phím điều hướng & Backspace
                input.addEventListener('keydown', (e) => handleKeyDown(e, i));
                // Sự kiện dán (Paste)
                input.addEventListener('paste', (e) => handlePaste(e));

                otpContainer.appendChild(input);
            }

            updateStatus();
            // Focus vào ô đầu tiên
            setTimeout(() => {
                const firstInput = otpContainer.querySelector('.otp-input');
                if (firstInput) firstInput.focus();
            }, 50);
        }

        // Xử lý khi người dùng nhập 0 hoặc 1
        function handleInput(e, index) {
            const inputs = getInputs();
            const value = e.target.value;

            // Chỉ nhận ký tự '0' hoặc '1'
            if (value !== '0' && value !== '1') {
                e.target.value = '';
                return;
            }

            // Tự động chuyển focus tới ô tiếp theo
            if (value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }

            hideResult();
            updateStatus();
            checkAndProcess();
        }

        // Xử lý phím nhấn (Backspace / Điều hướng)
        function handleKeyDown(e, index) {
            const inputs = getInputs();
            if (e.key === 'Backspace') {
                if (inputs[index].value === '' && index > 0) {
                    inputs[index - 1].focus();
                    inputs[index - 1].value = '';
                } else {
                    inputs[index].value = '';
                }
                hideResult();
                updateStatus();
            } else if (e.key === 'ArrowLeft' && index > 0) {
                inputs[index - 1].focus();
            } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        }

        // Xử lý Dán (Paste)
        function handlePaste(e) {
            e.preventDefault();
            const inputs = getInputs();
            const pastedData = (e.clipboardData || window.clipboardData).getData('text').trim();
            const regex = new RegExp(`^[01]{${currentLength}}$`);

            if (regex.test(pastedData)) {
                pastedData.split('').forEach((char, i) => {
                    if (inputs[i]) inputs[i].value = char;
                });
                inputs[currentLength - 1].focus();
                updateStatus();
                checkAndProcess();
            }
        }

        function getInputs() {
            return Array.from(otpContainer.querySelectorAll('.otp-input'));
        }

        // Cập nhật trạng thái
        function updateStatus() {
            const inputs = getInputs();
            const filledCount = inputs.filter(inp => inp.value !== '').length;
            if (filledCount === 0) {
                statusMessage.textContent = `Hãy nhập chữ số đầu tiên (Cần nhập ${currentLength} số)...`;
                statusMessage.className = 'text-center min-h-[24px] mb-6 text-sm font-medium text-slate-400';
            } else if (filledCount < currentLength) {
                statusMessage.textContent = `Đã nhập ${filledCount}/${currentLength} chữ số. Tiếp tục nhập...`;
                statusMessage.className = 'text-center min-h-[24px] mb-6 text-sm font-medium text-cyan-400';
            } else {
                statusMessage.textContent = `Đã nhận đủ ${currentLength} chữ số! Đang xử lý đảo vị trí...`;
                statusMessage.className = 'text-center min-h-[24px] mb-6 text-sm font-medium text-emerald-400';
            }
        }

        // Kiểm tra và khởi chạy xử lý
        function checkAndProcess() {
            const inputs = getInputs();
            const values = inputs.map(inp => inp.value);
            const isComplete = values.every(val => val === '0' || val === '1');

            if (isComplete && values.length === currentLength) {
                document.activeElement.blur();
                processBitFlip(values);
            }
        }

        // Chọn 2 vị trí ngẫu nhiên và đảo giá trị
        function processBitFlip(originalArray) {
            const indices = Array.from({ length: currentLength }, (_, i) => i);
            const flippedIndices = [];

            while (flippedIndices.length < 2) {
                const randomIndex = Math.floor(Math.random() * indices.length);
                const selected = indices.splice(randomIndex, 1)[0];
                flippedIndices.push(selected);
            }

            flippedIndices.sort((a, b) => a - b);

            const modifiedArray = [...originalArray];
            flippedIndices.forEach(idx => {
                modifiedArray[idx] = modifiedArray[idx] === '0' ? '1' : '0';
            });

            renderResult(originalArray, modifiedArray, flippedIndices);
        }

        // Hiển thị kết quả với Animation
        function renderResult(originalArray, modifiedArray, flippedIndices) {
            originalCodeSpan.textContent = originalArray.join('');
            newCodeSpan.textContent = modifiedArray.join('');
            flippedIndicesBadge.textContent = `Đã đảo vị trí: ${flippedIndices.map(i => i + 1).join(' và ')}`;

            // Render các thẻ kết quả theo độ dài currentLength
            resultCardsContainer.innerHTML = '';

            let cardSizeClass = 'w-10 h-12 sm:w-12 sm:h-14 text-xl sm:text-2xl';
            if (currentLength <= 5) {
                cardSizeClass = 'w-12 h-14 sm:w-14 sm:h-16 text-2xl sm:text-3xl';
            } else if (currentLength >= 8) {
                cardSizeClass = 'w-8 h-11 sm:w-11 sm:h-13 text-lg sm:text-xl';
            }

            originalArray.forEach((val, i) => {
                const card = document.createElement('div');
                card.className = `result-card ${cardSizeClass} rounded-xl sm:rounded-2xl flex flex-col items-center justify-center font-bold transition-all duration-300 border-2 border-slate-700 bg-slate-800 text-slate-300 relative flex-shrink-0`;
                
                card.innerHTML = `
                    <span class="res-val">${val}</span>
                    <span class="res-pos text-[8px] sm:text-[9px] text-slate-500 absolute bottom-0.5">Vị trí ${i + 1}</span>
                `;
                resultCardsContainer.appendChild(card);
            });

            resultBox.classList.remove('hidden');
            setTimeout(() => {
                resultBox.classList.remove('opacity-0', 'translate-y-4');
            }, 50);

            // Trigger animation lật & highlight
            const resultCards = resultCardsContainer.querySelectorAll('.result-card');
            setTimeout(() => {
                flippedIndices.forEach(idx => {
                    const card = resultCards[idx];
                    if (!card) return;
                    const valSpan = card.querySelector('.res-val');

                    card.classList.add('animate-flip');

                    setTimeout(() => {
                        valSpan.textContent = modifiedArray[idx];
                        card.classList.remove('bg-slate-800', 'border-slate-700', 'text-slate-300');
                        card.classList.add('bg-gradient-to-br', 'from-amber-500/20', 'to-orange-500/20', 'border-amber-500', 'text-amber-300', 'shadow-lg', 'shadow-amber-500/20');
                    }, 300);
                });
            }, 400);
        }

        function hideResult() {
            resultBox.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                resultBox.classList.add('hidden');
            }, 300);
        }

        // Reset ứng dụng
        function resetApp() {
            getInputs().forEach(input => {
                input.value = '';
            });
            hideResult();
            updateStatus();
            const inputs = getInputs();
            if (inputs[0]) inputs[0].focus();
        }

        // Chuyển đổi Dark / Light Mode
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                document.body.className = 'bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between transition-colors duration-300';
            } else {
                html.classList.add('dark');
                document.body.className = 'bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300';
            }
        }
    </script>
</body>
</html>
